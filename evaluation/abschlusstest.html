<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Schulazon - Posttest deaktiviert</title>
  <style>
    :root{
      --bg:#f5f5f7;
      --text:#0b0f18;
      --muted:rgba(11,15,24,.62);
      --hair:rgba(10,15,24,.08);
      --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:var(--sans);
      color:var(--text);
      background:linear-gradient(180deg,var(--bg),#eef1f7);
    }
    main{
      width:min(560px,100%);
      border:1px solid var(--hair);
      border-radius:22px;
      background:rgba(255,255,255,.82);
      box-shadow:0 24px 70px rgba(10,15,24,.10);
      padding:22px;
    }
    h1{margin:0 0 10px;font-size:24px}
    p{margin:0 0 16px;color:var(--muted);line-height:1.5}
    a{
      display:inline-flex;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid rgba(10,15,24,.12);
      color:inherit;
      text-decoration:none;
      font-weight:800;
      background:white;
    }
    .site-footer {
      position: fixed;
      left: 16px;
      bottom: 10px;
      display: flex;
      gap: 12px;
      font-size: 0.75rem;
      z-index: 50;
      opacity: 0.65;
    }
    .site-footer a {
      display: inline;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #64748b;
      text-decoration: none;
      font-weight: 400;
    }
    .site-footer a:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Posttest deaktiviert</h1>
    <p>Diese alte Evaluationsseite ist nicht mehr Teil des Schulazon-Ablaufs.</p>
    <a href="../index.html">Zur Startseite</a>
  </main>
  <footer class="site-footer">
    <a href="../impressum.html">Impressum</a>
  </footer>
</body>
</html>
