<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Schulazon – Skillcheck</title>

  <!-- Shop-Font (wie im Shop) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      /* Apple-ish system colors */
      --blue:   #007AFF;
      --purple: #AF52DE;
      --teal:   #34C759;
      --amber:  #FF9500;
      --pink:   #FF2D55;

      --bg0: #F5F5F7;
      --bg1: #EEF1F7;
      --text: #0B0F18;
      --muted: rgba(11,15,24,.62);

      --hair: rgba(10, 15, 24, .08);
      --hair2: rgba(10, 15, 24, .05);

      --shadow: 0 24px 70px rgba(10,15,24,.10);
      --shadow2: 0 12px 30px rgba(10,15,24,.08);

      --glass: rgba(255,255,255,.72);
      --glass2: rgba(255,255,255,.62);
      --glass3: rgba(255,255,255,.46);

      --focus: 0 0 0 6px rgba(0,122,255,.22);

      --radiusLg: 26px;
      --radiusMd: 18px;
      --radiusSm: 14px;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display","SF Pro Text","Segoe UI", Roboto, Helvetica, Arial;

      --base: clamp(18px, 1.35vw + 12px, 21px);
      --small: clamp(14px, 0.95vw + 10px, 16px);
      --h1: clamp(22px, 1.9vw + 14px, 30px);
      --sql: clamp(14px, 1.05vw + 10px, 16px);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: var(--sans);
      font-size: var(--base);
      color: var(--text);
      background:
        radial-gradient(900px 520px at 16% 10%, rgba(0,122,255,.14), transparent 62%),
        radial-gradient(900px 520px at 86% 12%, rgba(175,82,222,.12), transparent 62%),
        radial-gradient(980px 680px at 60% 92%, rgba(255,45,85,.08), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg0));
    }

    .shell{
      width: min(1920px, 99vw);
      margin: 0 auto;
      padding: 6px 4px 8px;
    }

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap: 12px; margin-bottom: 12px;
      padding: 10px 10px;
      border-radius: var(--radiusLg);
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(245,248,255,.90));
      border: 1px solid rgba(10,15,24,.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(10,15,24,.10), inset 0 1px 0 rgba(255,255,255,.7);
    }
    .topbar .pill, .topbar .pillBtn{border-radius: 14px;}

    .brand{display:flex; align-items:center; gap:12px;}
    .appIcon{
      width: 44px; height: 44px;
      border-radius: 16px;
      background:
        radial-gradient(18px 18px at 30% 28%, rgba(255,255,255,.88), transparent 58%),
        linear-gradient(180deg, rgba(0,122,255,.96), rgba(175,82,222,.70));
      box-shadow: 0 16px 34px rgba(0,122,255,.18);
      border: 1px solid rgba(255,255,255,.38);
    }


    /* Shop-Wordmark (wie im Shop) */
    .logo{
      font-family: "Roboto", var(--sans);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: 0;
      color: rgba(11,15,24,.92);
    }
    .logo span{color:#f08804}
    .brand h1{font-size: 15px; margin:0; font-weight: 900; letter-spacing: .2px; line-height: 1.05;}
    .brand .sub{font-size: var(--small); color: var(--muted); margin-top:2px; line-height: 1.15;}

    .status{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}

    .pill, .pillBtn{
      display:inline-flex; align-items:center; gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(10,15,24,.16);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(242,245,250,.92));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 24px rgba(10,15,24,.08);
      font-size: var(--small);
      color: var(--muted);
      user-select:none;
      white-space: nowrap;
    }
    .pill b{color: var(--text); font-weight: 900}

    .pillBtn{
      cursor:pointer;
      color: rgba(11,15,24,.92);
      font-weight: 900;
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }
    .pillBtn:hover{
      transform: translateY(-1px);
      border-color: rgba(0,122,255,.35);
      background: linear-gradient(180deg, rgba(255,255,255,.99), rgba(236,241,250,.92));
      box-shadow: 0 16px 36px rgba(10,15,24,.10);
    }
    .pillBtn:active{transform: translateY(0px)}
    .pillBtn:focus{outline:none; box-shadow:none;}
    .pillBtn:focus-visible{outline:none; box-shadow: var(--focus), 0 14px 30px rgba(10,15,24,.08)}

    .card{
      background: var(--glass2);
      border: 1px solid var(--hair2);
      border-radius: var(--radiusLg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow:hidden;
    }
    .cardInner{padding: 22px 22px 18px;}

    .qTitle{
      font-size: var(--h1);
      font-weight: 950;
      margin: 0 0 10px;
      letter-spacing: .15px;
      line-height: 1.12;
    }
    .qContext{
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
      font-size: var(--small);
    }

    /* Theory: Apple-like card + minimal highlights */
    .theory{
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.74);
      box-shadow: var(--shadow2);
      overflow:hidden;
      margin: 12px 0 14px;
    }
    .theoryHead{
      display:flex; align-items:center; justify-content:space-between;
      padding: 10px 12px;
      background:
        linear-gradient(180deg, rgba(0,122,255,.10), rgba(255,255,255,.00));
      border-bottom: 1px solid rgba(0,122,255,.10);
      font-size: var(--small);
      color: rgba(11,15,24,.86);
      font-weight: 950;
    }
    .theoryBody{
      padding: 12px 14px;
      font-size: var(--small);
      line-height: 1.65;
      color: rgba(11,15,24,.88);
    }
    .theoryBody p{margin:0}
    .theoryBody p + p{margin-top:10px}
    .theoryBody ul{margin: 8px 0 0 18px; padding:0}
    .theoryBody li{margin: 6px 0}

    /* Minimal highlight set */
    .hi{
      font-weight: 900;
      color: rgba(11,15,24,.92);
      background: rgba(175,82,222,.10);
      border: 1px solid rgba(175,82,222,.14);
      padding: 0 .32em;
      border-radius: .62em;
      white-space: nowrap;
    }
    .hiCode{
      font-family: var(--mono);
      font-weight: 900;
      color: rgba(0,122,255,.96);
      background: rgba(0,122,255,.10);
      border: 1px solid rgba(0,122,255,.14);
      padding: 0 .32em;
      border-radius: .62em;
      white-space: nowrap;
    }

    .schemaWrap{margin: 12px 0 14px;}
    .schemaLabel{
      --tone: var(--blue);
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--tone) 14%, white);
      border: 1px solid color-mix(in srgb, var(--tone) 22%, white);
      color: rgba(11,15,24,.86);
      font-size: var(--small);
      font-weight: 950;
      margin-bottom: 8px;
    }
    .tone-blue{--tone: var(--blue)}
    .tone-purple{--tone: var(--purple)}
    .tone-teal{--tone: var(--teal)}
    .tone-amber{--tone: var(--amber)}
    .tone-pink{--tone: var(--pink)}

    .codeBox{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.74);
      border-radius: var(--radiusMd);
      padding: 12px 12px;
      overflow:auto;
      box-shadow: var(--shadow2);
    }
    pre.sql{
      margin:0;
      font-family: var(--mono);
      font-size: var(--sql);
      line-height: 1.7;
      white-space: pre;
      color: rgba(11,15,24,.92);
    }
    .kw{color: rgba(0,122,255,.96); font-weight: 900}
    .cm{color: rgba(91,101,118,.92);}
    .id{color: rgba(11,15,24,.86); font-weight: 750;}
    .num{color: rgba(11,15,24,.86); font-weight: 900;}
    .op{color: rgba(11,15,24,.86); font-weight: 900;}

    /* Tables: cleaner, with subtle color */
    .tableGroup{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 12px;
      margin: 10px 0 0;
    }
    .miniTable{
      width:100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow:hidden;
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.80);
      font-size: var(--small);
      box-shadow: var(--shadow2);
    }
    .miniTable th, .miniTable td{
      padding: 12px 12px;
      border-bottom: 1px solid var(--hair2);
      vertical-align: top;
      color: rgba(11,15,24,.88);
    }
    .miniTable th{
      position: sticky;
      top: 0;
      z-index: 1;
      font-weight: 950;
      color: rgba(11,15,24,.92);
      background: rgba(10,15,24,.03);
    }
    .miniTable tr:last-child td{border-bottom:none}
    .miniTable tr:nth-child(even) td{background: rgba(10,15,24,.012)}
    .miniTable tr:hover td{background: rgba(0,122,255,.055)}
    .miniTable code{font-family: var(--mono); font-size: 0.95em}

    /* DISTINCT Visual */
    .distinctViz{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.68);
      border-radius: var(--radiusMd);
      padding: 12px;
      box-shadow: var(--shadow2);
      overflow:hidden;
      --d: 0;
    }
    .rangeRow{
      display:flex; align-items:center; gap:12px;
      margin: 2px 0 10px;
    }
    .rangeRow label{
      font-size: var(--small);
      font-weight: 950;
      color: rgba(11,15,24,.86);
      white-space: nowrap;
    }
    .rangeRow .val{
      font-size: var(--small);
      color: var(--muted);
      white-space: nowrap;
    }
    input[type="range"]{
      -webkit-appearance:none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(10,15,24,.10);
      outline:none;
    }
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;
      width: 18px; height: 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(175,82,222,1), rgba(0,122,255,.85));
      box-shadow: 0 12px 24px rgba(175,82,222,.16);
      border: 2px solid rgba(255,255,255,.90);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb{
      width: 18px; height: 18px;
      border-radius: 999px;
      background: rgba(175,82,222,.96);
      border: 2px solid rgba(255,255,255,.90);
      cursor: pointer;
    }
    .distinctRaw .dup{
      opacity: calc(1 - var(--d));
      filter: blur(calc(var(--d) * 0.7px));
    }
    .distinctOut{
      opacity: var(--d);
      transform: translateY(calc((1 - var(--d)) * 6px));
      transition: opacity .12s ease, transform .12s ease;
    }

    .taskCard{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.74);
      border-radius: var(--radiusMd);
      padding: 12px 12px;
      margin-top: 10px;
      box-shadow: var(--shadow2);
      position: relative;
      overflow:hidden;
    }
    .taskCard::before{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width: 6px;
      background: linear-gradient(180deg, rgba(0,122,255,.85), rgba(175,82,222,.70));
    }

    .blank input{
      height: 40px;
      border-radius: var(--radiusSm);
      border: 1px dashed rgba(0,122,255,.55);
      background: rgba(0,122,255,.06);
      padding: 0 10px;
      font-family: var(--mono);
      font-size: var(--sql);
      outline:none;
      text-transform: uppercase;
      min-width: 160px;
    }
    .blank input:focus{
      box-shadow: var(--focus);
      border-style: solid;
      background: rgba(255,255,255,.90);
    }

    .feedback{
      margin-top: 10px;
      padding: 12px 12px;
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.80);
      color: rgba(11,15,24,.86);
      font-size: var(--small);
      line-height: 1.45;
      display:none;
      box-shadow: var(--shadow2);
    }
    .feedback.ok{
      border-color: rgba(52,199,89,.22);
      background: linear-gradient(180deg, rgba(52,199,89,.10), rgba(255,255,255,.76));
    }
    .feedback.bad{
      border-color: rgba(255,149,0,.22);
      background: linear-gradient(180deg, rgba(255,149,0,.10), rgba(255,255,255,.76));
    }
    .feedback.show{display:block}

    .matchGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    .matchCol{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.72);
      border-radius: var(--radiusMd);
      padding: 12px;
      box-shadow: var(--shadow2);
    }
    .matchTitle{
      font-size: var(--small);
      font-weight: 950;
      color: rgba(11,15,24,.88);
      margin: 2px 0 10px;
    }
    .chip{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.82);
      border-radius: var(--radiusMd);
      padding: 12px 12px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      user-select:none;
      font-size: var(--small);
      color: rgba(11,15,24,.92);
      display:flex;
      justify-content:space-between;
      gap: 10px;
      align-items:center;
      margin-bottom: 10px;
      outline:none;
    }
    .chip:hover{transform: translateY(-1px); box-shadow: 0 16px 28px rgba(10,15,24,.08)}
    .chip:focus{box-shadow: var(--focus), 0 16px 28px rgba(10,15,24,.08)}
    .chip.selected{
      border-color: rgba(0,122,255,.38);
      background: rgba(0,122,255,.08);
    }
    .chip .tag{
      font-family: var(--mono);
      font-weight: 900;
      color: rgba(0,122,255,.92);
      white-space:nowrap;
    }

    .btnRow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top: 16px;
    }
    .btn{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.82);
      color: rgba(11,15,24,.92);
      padding: 12px 14px;
      border-radius: var(--radiusMd);
      font-weight: 950;
      font-size: var(--small);
      cursor:pointer;
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease, opacity .2s ease;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); box-shadow: 0 16px 28px rgba(10,15,24,.08)}
    .btn:active{transform: translateY(0px)}
    .btn:focus{outline:none; box-shadow: var(--focus), 0 16px 28px rgba(10,15,24,.08)}
    .btn.primary{
      border-color: rgba(0,122,255,.22);
      background: linear-gradient(180deg, rgba(0,122,255,.14), rgba(175,82,222,.06));
    }
    .btn.ghost{background: rgba(255,255,255,.66);}
    .btn.disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none !important;
      box-shadow:none !important;
    }

    .progressWrap{
      padding: 14px 22px;
      border-top: 1px solid var(--hair2);
      background: rgba(255,255,255,.44);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .progress{
      flex:1;
      height: 10px;
      border-radius: 999px;
      background: rgba(10,15,24,.08);
      overflow:hidden;
    }
    .bar{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(0,122,255,1), rgba(175,82,222,.90), rgba(255,45,85,.75));
      border-radius: 999px;
      transition: width .25s ease;
    }
    .stepTxt{font-size: var(--small); color: var(--muted)}
    .stepTxt b{color: var(--text); font-weight: 950}

    @media (prefers-reduced-motion: reduce){
      .btn, .chip, .pillBtn, .bar{transition:none !important}
      .btn:hover, .chip:hover, .pillBtn:hover{transform:none !important}
      .distinctOut{transition:none !important}
    }

    @media (max-width: 560px){
      .shell{padding: 6px 4px 8px}
      .cardInner{padding: 18px}
      .progressWrap{padding: 12px 18px}
      .matchGrid{grid-template-columns: 1fr;}
    }

    /* ---------- Pretest: zusätzliche UI-Bausteine im Tutorial-Look ---------- */

    .hidden{display:none !important;}

    /* Typografie-Überschriften (Pretest nutzt h2 in hero) */
    .hero{display:flex; gap: 14px; align-items:flex-start;}
    .hero h2{
      margin:0 0 10px;
      font-size: var(--h1);
      font-weight: 950;
      letter-spacing: .15px;
      line-height: 1.12;
    }
    .hero p{margin:0 0 10px; color: var(--muted); line-height: 1.55; font-size: var(--small);}
    .hero p b{color: rgba(11,15,24,.92); font-weight: 950;}

    .hint{
      margin-top: 12px;
      padding: 12px 12px;
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: linear-gradient(180deg, rgba(0,122,255,.10), rgba(255,255,255,.74));
      box-shadow: var(--shadow2);
      color: rgba(11,15,24,.88);
      font-size: var(--small);
      line-height: 1.55;
    }
    .hintBig{ padding: 14px 14px; font-size: var(--base); }

    
    .startForm{
      margin-top: 14px;
      padding: 14px 14px;
      border-radius: var(--radiusLg);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.62);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

.row{display:flex; gap:12px; flex-wrap:wrap; margin-top: 14px}
    .field{flex: 1 1 340px; display:flex; flex-direction:column; gap:8px;}
    label{font-size: var(--small); color: var(--muted);}

    input[type="text"]{
      height: 52px;
      padding: 0 12px;
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.82);
      outline:none;
      font-size: var(--base);
      transition: box-shadow .2s ease, transform .12s ease, border-color .2s ease;
      text-transform: uppercase;
    }
    input[type="text"]::placeholder{ text-transform:none; }
    input[type="text"]:focus{ box-shadow: var(--focus); border-color: rgba(0,122,255,.28); transform: translateY(-1px); }

    .checkRow{
      display:flex;
      align-items:flex-start;
      gap: 10px;
      margin-top: 12px;
      padding: 12px 12px;
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.74);
      box-shadow: var(--shadow2);
    }
    .checkRow input[type="checkbox"]{
      transform: scale(1.15);
      margin-top: 3px;
      accent-color: var(--blue);
    }
    .checkRow .txt{font-size: var(--small); color: rgba(11,15,24,.86); line-height: 1.45}

    /* Prompt/Schema-Karten (Pretest) */
    .promptCard{
      margin: 0 0 12px;
      padding: 12px 12px;
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.74);
      box-shadow: var(--shadow2);
    }
    .qPrompt{
      margin: 0;
      color: rgba(11,15,24,.92);
      line-height: 1.55;
      font-size: var(--base);
      font-weight: 950;
      letter-spacing: .12px;
    }

    .schemaWrap{margin: 12px 0 14px;}
    .schemaLabel{
      --tone: var(--blue);
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--tone) 14%, white);
      border: 1px solid color-mix(in srgb, var(--tone) 22%, white);
      color: rgba(11,15,24,.86);
      font-size: var(--small);
      font-weight: 950;
      margin-bottom: 8px;
    }
    .schemaBox{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.74);
      border-radius: var(--radiusMd);
      padding: 12px 12px;
      box-shadow: var(--shadow2);
      overflow:auto;
      white-space: pre-wrap;
      font-family: var(--mono);
      font-size: var(--sql);
      color: rgba(11,15,24,.92);
      line-height: 1.7;
    }

    /* Multiple-Choice (Pretest) */
    .choices{display:grid; gap:12px; margin-top: 10px;}
    .choice{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.78);
      border-radius: var(--radiusMd);
      padding: 12px 12px;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      display:flex; align-items:flex-start; gap:12px;
      user-select:none;
      outline:none;
    }
    .choice:hover{transform: translateY(-1px); box-shadow: 0 16px 28px rgba(10,15,24,.08);}
    .choice:focus{box-shadow: var(--focus), 0 16px 28px rgba(10,15,24,.08);}
    .bullet{
      width: 20px; height: 20px; border-radius: 999px;
      border: 2px solid rgba(11,15,24,.22);
      margin-top: 2px;
      flex: 0 0 20px;
      position:relative;
    }

    startedAt: null,

  function normalize(str){
    return (str ?? "").toString().trim().replace(/;$/,"").replace(/\s+/g," ").toLowerCase();
  }
  function normalizeNoSpace(str){
    return (str ?? "").toString().trim().replace(/;$/,"").replace(/\s+/g,"").toLowerCase();
  }

  function escapeHtml(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function escapeAttr(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll('"',"&quot;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }

    if(!id) return;

  }

  function recordItemTime(id){
    if(!id) return;
    if(state.itemTimes[id] != null) return;
    const start = state.itemStartAt[id];
    if(!start) return;
    state.itemTimes[id] = Math.max(0, Date.now() - start);
  }

function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function formatName(raw){
    const s = (raw ?? "").toString().trim();
    if(!s) return "";
    const cleaned = s.replace(/\s+/g, " ");

    // Wenn kurz (z.B. "JK"), dann eher als Kürzel behandeln
    if(cleaned.length <= 3) return cleaned.toUpperCase();

    // Wenn Ziffern/Sonderzeichen drin: nicht "kaputt-formatieren"
    if(/[^A-Za-zÀ-ÖØ-öø-ÿÄÖÜäöüß \-]/.test(cleaned)) return cleaned;

    // Title-Case je Wort, aber nur wenn nicht bewusst schon gemischt geschrieben
    const hasUpper = /[A-ZÄÖÜ]/.test(cleaned);
    const hasLower = /[a-zäöüß]/.test(cleaned);

    // Wenn komplett lower oder "normal": Title Case
    if(!hasUpper && hasLower){
      return cleaned
        .split(/(\s+|\-)/)
        .map(part=>{
          if(part.trim()==="" || part==="-" ) return part;
          const first = part.charAt(0).toUpperCase();
          const rest = part.slice(1).toLowerCase();
          return first + rest;
        })
        .join("");
    }

    // sonst wie eingegeben (z.B. "McDonald", "Max")
    return cleaned;
  }

  function hashStr(s){
  // deterministische Auswahl für variierende, aber stabile Gesprächs-Phrasen pro Frage
  let h = 2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function pickVariant(key, variants){
  const h = hashStr(String(key));
  return variants[h % variants.length];
}

  function requestFreeModeName(onSubmit){
    clearStoredFreeModeName();
    document.querySelector(".name-modal")?.remove();

    const wrap = document.createElement("div");
    wrap.className = "name-modal";
    wrap.innerHTML = `
      <form class="name-dialog" id="freeNameForm" novalidate>
        <h2>Wie heißt du ?</h2>
        <p>Gib deinen Entwicklernamen ein.</p>
        <label for="freeModeName">Entwicklername</label>

        <div class="name-error" id="freeNameError">Bitte gib einen Namen ein.</div>
        <div class="name-actions">
          <button class="btn" id="freeNameCancel" type="button">Abbrechen</button>
          <button class="btn primary" type="submit">Weiter</button>
        </div>
      </form>
    `;
    document.body.appendChild(wrap);

    const form = wrap.querySelector("#freeNameForm");
    const input = wrap.querySelector("#freeModeName");
    const error = wrap.querySelector("#freeNameError");
    const cancel = wrap.querySelector("#freeNameCancel");

    window.setTimeout(()=>input.focus(), 0);

    cancel.addEventListener("click", ()=>{
      wrap.remove();
    });

    form.addEventListener("submit", (event)=>{
      event.preventDefault();
      const name = cleanFreeModeName(input.value);
      if(!name){
        error.classList.add("show");
        input.focus();
        return;
      }
      error.classList.remove("show");
      wrap.remove();
      onSubmit(name);
    });
  }




  function renderStart(){
    el("progressWrap").style.display = "none";
    el("nameTag").textContent = state.name ? `Hi, ${state.name}` : "";
    el("pillStep").style.display = "none";
    el("subline").textContent = "Skillcheck";
    const introHeadline = displayName()
      ? `Hi ${displayName()}, schön, dass du dich bei Schulazon als Shop-Entwickler beworben hast!`
      : "Schön, dass du dich bei Schulazon als Shop-Entwickler beworben hast!";

    el("screen").innerHTML = `
      <div class="hero">
        <div style="flex:1">
          <h2>${escapeHtml(introHeadline)}</h2>
          <p style="font-size: var(--base);">Wir haben ein paar kurze Fragen vorbereitet, um deine SQL-Kenntnisse besser einschätzen zu können.</p>

          <div class="hint hintBig">
            Danach starten wir je nach Ergebnis mit der geführten Einarbeitung oder direkt im freien Modus.
          </div>

          <div class="btnRow navRow" id="introCtaRow">
            <div></div>
            <button class="btn primary" id="introContinue">Okay – lass starten</button>
          </div>
            </div>

          </div>
        </div>
      </div>
    `;

    const introContinue = el("introContinue");
    introContinue.addEventListener("click", ()=>{
      startTest();
    });
  }
  function renderQuestion(){
    const idx = state.step;
    const total = questions.length;
    const q = questions[idx];
    markItemStart(q.id);

    el("pillStep").style.display = "flex";
    el("nameTag").textContent = state.name ? `Hi, ${state.name}` : "";
    el("stepTag").textContent = `${idx+1}/${total}`;

    el("progressWrap").style.display = "flex";
    el("stepSmall").textContent = String(idx+1);
    el("stepTotal").textContent = String(total);
    el("bar").style.width = `${((idx)/ (total-1))*100}%`;

    const schemaHTML = (q.schema && q.schema.length)
      ? `
        <div class="schemaWrap">
          <div class="schemaLabel">Schema</div>
          <div class="schemaBox">${q.schema.map(s=>escapeHtml(s)).join("\n")}</div>
        </div>
      `
      : "";

    let bodyHTML = "";

    if(q.type === "mc"){
      const selected = state.answers[q.id] ?? null;
      bodyHTML = `
        ${schemaHTML}
        <div class="choices" role="list">
          ${q.options.map((opt, i)=>`
            <div class="choice ${selected===i ? "selected":""}" data-i="${i}" role="listitem" tabindex="0">
              <div class="bullet" aria-hidden="true"></div>
              <div class="sql">${escapeHtml(["A","B","C","D"][i] + ") " + opt)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    if(q.type === "fill"){
      const ans = state.answers[q.id] ?? "";
      const parts = q.template.split("______");
      const before = parts[0] ?? "";
      const after  = parts[1] ?? "";
      bodyHTML = `
        ${schemaHTML}
        <div class="fillWrap">
          <pre class="fillCode">${escapeHtml(before)}<span class="blank"><input id="blankInput" type="text" value="${escapeAttr(ans)}" placeholder="..." /></span>${escapeHtml(after)}</pre>
        </div>
      `;
    }

    if(q.type === "likert"){
      const current = state.likert[q.id] ?? null;
      bodyHTML = `
        <div class="schemaWrap">
          <div class="schemaLabel">Skala</div>
          <div class="
          Box" style="font-family:var(--sans);">
            1 = stimme gar nicht zu · 2 = eher nicht · 3 = teils/teils · 4 = eher zu · 5 = stimme voll zu
          </div>
        </div>
        <div class="likert" role="group" aria-label="Likert-Auswahl">
          ${[1,2,3,4,5].map(n=>`
            <div class="likertBtn ${current===n ? "selected":""}" data-n="${n}" tabindex="0">${n}</div>
          `).join("")}
        </div>
      `;
    }

    const isLast = idx === total - 1;

    el("screen").innerHTML = `
      <div class="hero" style="align-items:flex-start;">
        <div style="flex:1">
          <div class="promptCard">
            <p class="qPrompt">${escapeHtml(promptWithName(q))}</p>
          </div>
          ${bodyHTML}
          <div class="btnRow">
            <div></div>
            <button class="btn primary disabled" id="nextBtn">${isLast ? "Abgeben" : "Weiter"}</button>
          </div>
        </div>
      </div>
    `;

    const nextBtn = el("nextBtn");

    if(q.type === "mc"){
      const nodes = [...document.querySelectorAll(".choice")];
      nodes.forEach((node, idxNode)=>{
        const pick = ()=>{
          const i = Number(node.dataset.i);
          state.answers[q.id] = i;
          nodes.forEach(n=>n.classList.remove("selected"));
          node.classList.add("selected");
          nextBtn.classList.remove("disabled");
        };
        node.addEventListener("click", pick);
        node.addEventListener("keydown", (e)=>{
          if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); return; }
          if(e.key === "ArrowDown" || e.key === "ArrowRight"){
            e.preventDefault();
            nodes[Math.min(idxNode+1, nodes.length-1)].focus();
            return;
          }
          if(e.key === "ArrowUp" || e.key === "ArrowLeft"){
            e.preventDefault();
            nodes[Math.max(idxNode-1, 0)].focus();
            return;
          }
        });
      });
      if(typeof state.answers[q.id] === "number") nextBtn.classList.remove("disabled");
    }

    if(q.type === "fill"){
      const inp = el("blankInput");
      const update = ()=>{
        const v = inp.value;
        state.answers[q.id] = v;
        nextBtn.classList.toggle("disabled", v.trim().length === 0);
      };
      inp.addEventListener("input", update);
      update();
      setTimeout(()=>inp.focus(), 30);
    }

    if(q.type === "likert"){
      const btns = [...document.querySelectorAll(".likertBtn")];
      const setSel = (n)=>{
        state.likert[q.id] = n;
        btns.forEach(b=>b.classList.toggle("selected", Number(b.dataset.n)===n));
        nextBtn.classList.remove("disabled");
      };
      btns.forEach((b, idxBtn)=>{
        const pick = ()=> setSel(Number(b.dataset.n));
        b.addEventListener("click", pick);
        b.addEventListener("keydown",(e)=>{
          if(e.key==="Enter" || e.key===" "){ e.preventDefault(); pick(); return; }
          if(e.key === "ArrowRight"){
            e.preventDefault();
            btns[Math.min(idxBtn+1, btns.length-1)].focus();
            return;
          }
          if(e.key === "ArrowLeft"){
            e.preventDefault();
            btns[Math.max(idxBtn-1, 0)].focus();
            return;
          }
        });
      });
      if(state.likert[q.id] != null) nextBtn.classList.remove("disabled");
    }

    nextBtn.addEventListener("click", ()=>{
      if(nextBtn.classList.contains("disabled")) return;
      recordItemTime(q.id);
      if(isLast) submit("manual");
      else { state.step++; renderQuestion(); }
    });
  }

  function scoreAndAnalyze(){
    const contentIds = ["q1","q2","q3","q4","q5","q6","q7","q8"];
    const correctMap = {};
    let score = 0;

    ["q1","q2","q3","q4"].forEach(id=>{
      const q = baseQuestions.find(x=>x.id===id);
      const a = state.answers[id];
      const ok = (q && typeof a === "number" && a === q.correctIndex);
      correctMap[id] = !!ok;
      if(ok) score++;
    });

    ["q5","q6","q7","q8"].forEach(id=>{
      const q = baseQuestions.find(x=>x.id===id);
      const a = state.answers[id] ?? "";
      let ok = false;
      if(q){
        ok = q.correct.some(c=>{
          if(id === "q7") return normalizeNoSpace(a) === normalizeNoSpace(c);
          return normalize(a) === normalize(c);
        });
      }
      correctMap[id] = !!ok;
      if(ok) score++;
    });

    const wrongIds = contentIds.filter(id => !correctMap[id]);
    const specialSet = new Set(["q3","q7","q8"]);
    const onlySpecialWrong = wrongIds.length > 0 && wrongIds.every(id => specialSet.has(id));

    return { score, correctMap, wrongIds, onlySpecialWrong };
  }

  function makeCode(score, r1, r2, elapsedSec){
    return `PRE-S${score}-R${r1}${r2}-T${elapsedSec}`;
  }

  function renderResult(result){
    state.nextMode = (result.score <= 3) ? "tutorial" : "free";
    renderFeedback();
  }

  function renderFeedback(){
    const res = state.lastResult;
    if(!res){ renderStart(); return; }

    el("progressWrap").style.display = "none";
    el("pillStep").style.display = "none";
    el("subline").textContent = "Skillcheck – Feedback";

    const score = res.score;
    const shouldTutorial = score <= 3;

    if(shouldTutorial){
      el("screen").innerHTML = `
        <div class="hero">
          <div style="flex:1">
            <h2>${thanksTitle()}</h2>
            <p>Wir wiederholen kurz die Grundlagen in der geführten Einarbeitung. Danach gehst du direkt in den freien Modus.</p>
            <div class="hint">Nächster Schritt: Geführte Einarbeitung.</div>
            <div class="btnRow">
              <div></div>
              <button class="btn primary" id="toTutorialBtn">Zur geführten Einarbeitung</button>
            </div>
          </div>
        </div>
      `;
      el("toTutorialBtn").addEventListener("click", ()=>{ goToGuidedTutorial(); });
      return;
    }

    el("screen").innerHTML = `
      <div class="hero">
        <div style="flex:1">
          <h2>${positiveTitle()}</h2>
          <p>Du kannst direkt im freien Modus starten.</p>
          <div class="hint">Nächster Schritt: Freier Modus.</div>
          <div class="btnRow">
            <div></div>
            <button class="btn primary" id="toFreeBtn">Zum freien Modus</button>
          </div>
        </div>
      </div>
    `;
    el("toFreeBtn").addEventListener("click", ()=>{ goToFreeMode(); });
  }

  function renderContract(){
    el("subline").textContent = "Skillcheck – Vertrag";

    el("screen").innerHTML = `
      <div class="hero">
        <div style="flex:1">
          <h2>${congratsTitle()}</h2>
          <p>Wir stellen dich ein. Vertrag kurz abhaken – dann geht’s los.</p>

          <div class="schemaWrap" style="margin-top:14px;">
            <div class="schemaLabel">Kurzvertrag</div>
            <div class="schemaBox" style="font-family: var(--sans);">
              <b>Schulazon – Entwicklervertrag</b><br>
              Rolle: Normaler Entwickler · Start: sofort · Team: Shop-Engineering<br>
              Aufgabe: Du hilfst uns dabei, fehlende Buttons im Shop zu implementieren.<br><br>
              Unterschrift: <b>${escapeHtml(signatureName())}</b>
            </div>
          </div>

          <div class="checkRow">
            <input id="sigCheck" type="checkbox" />
            <div class="txt"><b>X</b> Ich unterschreibe den Vertrag als <b>${escapeHtml(signatureName())}</b>.</div>
          </div>

          <div class="btnRow">
            <div></div>
            <button class="btn primary disabled" id="signBtn">Vertrag unterschreiben</button>
          </div>
        </div>
      </div>
    `;

    const sigCheck = el("sigCheck");
    const signBtn = el("signBtn");

    const update = ()=>{
      const ok = sigCheck.checked;
      signBtn.classList.toggle("disabled", !ok);
    };

    sigCheck.addEventListener("change", update);
    update();

    signBtn.addEventListener("click", ()=>{
      if(signBtn.classList.contains("disabled")) return;
      state.contractSigned = true;
      renderOnboarding();
    });
  }

  function renderOnboarding(){
    el("subline").textContent = "Schulazon – Onboarding";

    el("screen").innerHTML = `
      <div class="hero">
        <div style="flex:1">
          <h2>Eingestellt.</h2>
          <p>Du bist als normaler Entwickler im Team. Du kannst jetzt direkt helfen, fehlende Buttons in unserem Shop zu programmieren.</p>

          <div class="hint">Nächster Schritt: Shop-Projekt starten.</div>

          <div class="btnRow">
            <div></div>
            <button class="btn primary" id="startBtn">Starten</button>
          </div>
        </div>
      </div>
    `;

    const startBtn = el("startBtn");
    startBtn.addEventListener("click", ()=>{ goToFreeMode(); });
  }

  function submit(mode){
    if(state.endedAt) return;
    const current = questions[state.step];
    if(current && current.id) recordItemTime(current.id);
    state.endedAt = Date.now();

    const elapsedSec = Math.max(0, Math.round((state.endedAt - state.startedAt)/1000));

    const { score, correctMap, wrongIds, onlySpecialWrong } = scoreAndAnalyze();

    const r1 = state.likert.r1 ?? 0;
    const r2 = state.likert.r2 ?? 0;

    const code = makeCode(score, r1, r2, elapsedSec);

    state.lastResult = { score, r1, r2, elapsedSec, code, correctMap, wrongIds, onlySpecialWrong, mode };
    renderResult(state.lastResult);
  }
  function startTest(){
    const likertQs = baseQuestions.filter((q)=> q.type === "likert");
    const contentQs = baseQuestions.filter((q)=> q.type !== "likert");
    questions = [...likertQs, ...shuffle(contentQs)];

    state.startedAt = Date.now();
    state.endedAt = null;
    state.step = 0;
    state.answers = {};
    state.likert = { r1:null, r2:null };
    state.lastResult = null;
    state.contractSigned = false;
    state.itemStartAt = {};
    state.itemTimes = {};
    el("pillStep").style.display = "flex";
    el("nameTag").textContent = state.name ? `Hi, ${state.name}` : "";
    renderQuestion();
  }

  async function toggleFullscreen(){
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    }catch{}
  }
  if(el("fsBtn")) el("fsBtn").addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", ()=>{
    if(el("fsBtn")) el("fsBtn").textContent = document.fullscreenElement ? "Vollbild aus" : "Vollbild";
  });
  document.querySelector(".close-link")?.addEventListener("click", (event)=>{
    event.preventDefault();
    smoothGo("../index.html");
  });

  // Global: Enter = Weiter/Abgeben, ohne die Struktur zu verändern
  document.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;

    // Intro-Screen: Enter startet, wenn möglich
    const introContinue = document.getElementById("introContinue");
    if(introContinue && !introContinue.classList.contains("disabled")){
      e.preventDefault();
      introContinue.click();
      return;
    }

    // Schueler-ID-Screen: Enter bestaetigt, wenn moeglich
    const idContinue = document.getElementById("idContinue");
    if(idContinue && !idContinue.classList.contains("disabled")){
      e.preventDefault();
      idContinue.click();
      return;
    }

    // Fragen-Screen: Enter klickt "Weiter/Abgeben"
    const nextBtn = document.getElementById("nextBtn");
    if(nextBtn && !nextBtn.classList.contains("disabled")){
      e.preventDefault();
      nextBtn.click();
      return;
    }// Onboarding: Enter startet, wenn moeglich
    const startBtn = document.getElementById("startBtn");
    if(startBtn && !startBtn.classList.contains("disabled")){
      e.preventDefault();
      startBtn.click();
      return;
    }

    // Vertrag: Enter unterschreibt, wenn möglich
    const signBtn = document.getElementById("signBtn");
    if(signBtn && !signBtn.classList.contains("disabled")){
      e.preventDefault();
      signBtn.click();
      return;
    }
  });


  renderStart();
</script>
