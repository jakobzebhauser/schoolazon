<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Schulazon – Grundlagen-Refresh</title>

  <!-- Shop-Font (wie im Shop) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      /* Apple-ish system colors */
      --blue:   #007AFF;
      --purple: #AF52DE;
      --teal:   #34C759;
      --amber:  #FF9500;
      --pink:   #FF2D55;

      --bg0: #F5F5F7;
      --bg1: #EEF1F7;
      --text: #0B0F18;
      --muted: rgba(11,15,24,.62);

      --hair: rgba(10, 15, 24, .08);
      --hair2: rgba(10, 15, 24, .05);

      --shadow: 0 24px 70px rgba(10,15,24,.10);
      --shadow2: 0 12px 30px rgba(10,15,24,.08);

      --glass: rgba(255,255,255,.72);
      --glass2: rgba(255,255,255,.62);
      --glass3: rgba(255,255,255,.46);

      --focus: 0 0 0 6px rgba(0,122,255,.22);

      --radiusLg: 26px;
      --radiusMd: 18px;
      --radiusSm: 14px;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display","SF Pro Text","Segoe UI", Roboto, Helvetica, Arial;

      --base: clamp(18px, 1.35vw + 12px, 21px);
      --small: clamp(14px, 0.95vw + 10px, 16px);
      --h1: clamp(22px, 1.9vw + 14px, 30px);
      --sql: clamp(14px, 1.05vw + 10px, 16px);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: var(--sans);
      font-size: var(--base);
      color: var(--text);
      background:
        radial-gradient(900px 520px at 16% 10%, rgba(0,122,255,.14), transparent 62%),
        radial-gradient(900px 520px at 86% 12%, rgba(175,82,222,.12), transparent 62%),
        radial-gradient(980px 680px at 60% 92%, rgba(255,45,85,.08), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg0));
    }

    .shell{
      width: min(1920px, 99vw);
      margin: 0 auto;
      padding: 10px 8px 12px;
    }

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap: 12px; margin-bottom: 12px;
      padding: 10px 10px;
      border-radius: var(--radiusLg);
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(245,248,255,.90));
      border: 1px solid rgba(10,15,24,.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(10,15,24,.10), inset 0 1px 0 rgba(255,255,255,.7);
    }

    .brand{display:flex; align-items:center; gap:12px;}
    .appIcon{
      width: 44px; height: 44px;
      border-radius: 16px;
      background:
        radial-gradient(18px 18px at 30% 28%, rgba(255,255,255,.88), transparent 58%),
        linear-gradient(180deg, rgba(0,122,255,.96), rgba(175,82,222,.70));
      box-shadow: 0 16px 34px rgba(0,122,255,.18);
      border: 1px solid rgba(255,255,255,.38);
    }

    /* Shop-Wordmark (wie im Shop) */
    .logo{
      font-family: "Roboto", var(--sans);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: 0;
      color: rgba(11,15,24,.92);
    }
    .logo span{color:#f08804}
    .brand h1{font-size: 15px; margin:0; font-weight: 900; letter-spacing: .2px; line-height: 1.05;}
    .brand .sub{font-size: var(--small); color: var(--muted); margin-top:2px; line-height: 1.15;}

    .status{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}

    .pill, .pillBtn{
      display:inline-flex; align-items:center; gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(10,15,24,.16);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(242,245,250,.92));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 24px rgba(10,15,24,.08);
      font-size: var(--small);
      color: var(--muted);
      user-select:none;
      white-space: nowrap;
    }
    .pill b{color: var(--text); font-weight: 900}

    .pillBtn{
      cursor:pointer;
      color: rgba(11,15,24,.92);
      font-weight: 900;
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }
    .pillBtn:hover{
      transform: translateY(-1px);
      border-color: rgba(0,122,255,.35);
      background: linear-gradient(180deg, rgba(255,255,255,.99), rgba(236,241,250,.92));
      box-shadow: 0 16px 36px rgba(10,15,24,.10);
    }
    .pillBtn:active{transform: translateY(0px)}
    .pillBtn:focus{outline:none; box-shadow: var(--focus), 0 14px 30px rgba(10,15,24,.08)}

    .card{
      background: var(--glass2);
      border: 1px solid var(--hair2);
      border-radius: var(--radiusLg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow:hidden;
    }
    .cardInner{padding: 22px 22px 18px;}

    .qTitle{
      font-size: var(--h1);
      font-weight: 950;
      margin: 0 0 10px;
      letter-spacing: .15px;
      line-height: 1.12;
    }
    .qContext{
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
      font-size: var(--small);
    }

    /* Theory block */
    .theory{
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.74);
      box-shadow: var(--shadow2);
      overflow:hidden;
      margin: 12px 0 14px;
    }
    .theoryHead{
      display:flex; align-items:center; justify-content:space-between;
      padding: 10px 12px;
      background:
        linear-gradient(180deg, rgba(0,122,255,.10), rgba(255,255,255,.00));
      border-bottom: 1px solid rgba(0,122,255,.10);
      font-size: var(--small);
      color: rgba(11,15,24,.86);
      font-weight: 950;
    }
    .theoryBody{
      padding: 12px 14px;
      font-size: var(--small);
      line-height: 1.65;
      color: rgba(11,15,24,.88);
    }
    .theoryBody p{margin:0}
    .theoryBody p + p{margin-top:10px}
    .theoryBody ul{margin: 8px 0 0 18px; padding:0}
    .theoryBody li{margin: 6px 0}

    /* Task block (distinct color) */
    .theory.taskBlock{
      background: linear-gradient(180deg, rgba(0,122,255,.08), rgba(255,255,255,.70));
      border: 1px solid rgba(0,122,255,.18);
    }
    .theory.taskBlock .theoryHead{
      background: linear-gradient(180deg, rgba(175,82,222,.16), rgba(255,255,255,.00));
      border-bottom: 1px solid rgba(175,82,222,.16);
    }

    /* Minimal highlight set */
    .hi{
      font-weight: 900;
      color: rgba(11,15,24,.92);
      background: rgba(175,82,222,.10);
      border: 1px solid rgba(175,82,222,.14);
      padding: 0 .32em;
      border-radius: .62em;
      white-space: nowrap;
    }
    .hiCode{
      font-family: var(--mono);
      font-weight: 900;
      color: rgba(0,122,255,.96);
      background: rgba(0,122,255,.10);
      border: 1px solid rgba(0,122,255,.14);
      padding: 0 .32em;
      border-radius: .62em;
      white-space: nowrap;
    }

    .hiPK{
      font-weight: 900;
      color: rgba(11,15,24,.92);
      background: rgba(52,199,89,.12);
      border: 1px solid rgba(52,199,89,.18);
      padding: 0 .32em;
      border-radius: .62em;
      white-space: nowrap;
    }
    .hiFK{
      font-weight: 900;
      color: rgba(11,15,24,.92);
      background: rgba(255,149,0,.12);
      border: 1px solid rgba(255,149,0,.18);
      padding: 0 .32em;
      border-radius: .62em;
      white-space: nowrap;
    }
    .pkTok{
      font-family: var(--mono);
      font-weight: 950;
      color: rgba(52,199,89,.96);
      background: rgba(52,199,89,.12);
      border: 1px solid rgba(52,199,89,.18);
      padding: 0 .22em;
      border-radius: .50em;
      white-space: nowrap;
    }
    .fkTok{
      font-family: var(--mono);
      font-weight: 950;
      color: rgba(255,149,0,.96);
      background: rgba(255,149,0,.12);
      border: 1px solid rgba(255,149,0,.18);
      padding: 0 .22em;
      border-radius: .50em;
      white-space: nowrap;
    }

/* Schlüssel-Markierung umschaltbar (nur Verbund-Seite) */
.keyToggleRow{display:flex; gap:10px; flex-wrap:wrap; margin: 10px 0 0;}
.keyToggleRow .pillBtn{padding: 8px 10px; font-size: var(--small);}

/* Toggle: farbige Markierung aus */
.pkOff .pkTok, .pkOff .hiPK{
  background: transparent !important;
  border-color: transparent !important;
  color: inherit !important;
  font-weight: inherit !important;
  padding: 0 !important;
}
.fkOff .fkTok, .fkOff .hiFK{
  background: transparent !important;
  border-color: transparent !important;
  color: inherit !important;
  font-weight: inherit !important;
  padding: 0 !important;
}

    .schemaWrap{margin: 12px 0 14px;}
    .schemaLabel{
      --tone: var(--blue);
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--tone) 14%, white);
      border: 1px solid color-mix(in srgb, var(--tone) 22%, white);
      color: rgba(11,15,24,.86);
      font-size: var(--small);
      font-weight: 950;
      margin-bottom: 8px;
    }
    .tone-blue{--tone: var(--blue)}
    .tone-purple{--tone: var(--purple)}
    .tone-teal{--tone: var(--teal)}
    .tone-amber{--tone: var(--amber)}
    .tone-pink{--tone: var(--pink)}

    .codeBox{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.74);
      border-radius: var(--radiusMd);
      padding: 12px 12px;
      overflow:auto;
      box-shadow: var(--shadow2);
    }
    pre.sql{
      margin:0;
      font-family: var(--mono);
      font-size: var(--sql);
      line-height: 1.7;
      white-space: pre;
      color: rgba(11,15,24,.92);
    }
    .kw{color: rgba(0,122,255,.96); font-weight: 900}
    .cm{color: rgba(91,101,118,.92);}
    .id{color: rgba(11,15,24,.86); font-weight: 750;}
    .num{color: rgba(11,15,24,.86); font-weight: 900;}
    .op{color: rgba(11,15,24,.86); font-weight: 900;}

    /* Tables */
    .tableGroup{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 12px;
      margin: 10px 0 0;
    }
    .miniTable{
      width:100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow:hidden;
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.80);
      font-size: var(--small);
      box-shadow: var(--shadow2);
    }
    .miniTable th, .miniTable td{
      padding: 12px 12px;
      border-bottom: 1px solid var(--hair2);
      vertical-align: top;
      color: rgba(11,15,24,.88);
    }
    .miniTable th{
      position: sticky;
      top: 0;
      z-index: 1;
      font-weight: 950;
      color: rgba(11,15,24,.92);
      background: rgba(10,15,24,.03);
    }
    .miniTable tr:last-child td{border-bottom:none}
    .miniTable tr:nth-child(even) td{background: rgba(10,15,24,.012)}
    .miniTable tr:hover td{background: rgba(0,122,255,.055)}
    .miniTable code{font-family: var(--mono); font-size: 0.95em}

    .narrowWrap{
      max-width: 680px;
      margin: 0 auto;
    }
    .narrowWrap .miniTable{margin-bottom: 12px}

    details.reveal{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.66);
      border-radius: var(--radiusMd);
      padding: 10px 12px;
      box-shadow: var(--shadow2);
      overflow:hidden;
      margin: 10px 0 0;
    }
    details.reveal > summary{
      cursor: pointer;
      font-weight: 950;
      color: rgba(11,15,24,.86);
      list-style: none;
      user-select:none;
    }
    details.reveal > summary::-webkit-details-marker{display:none}
    details.reveal > summary::after{
      content: "▾";
      float: right;
      color: rgba(11,15,24,.62);
    }
    details.reveal[open] > summary::after{content:"▴"}

    .taskCard{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.74);
      border-radius: var(--radiusMd);
      padding: 12px 12px;
      margin-top: 10px;
      box-shadow: var(--shadow2);
      position: relative;
      overflow:hidden;
    }
    .taskCard::before{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width: 6px;
      background: linear-gradient(180deg, rgba(0,122,255,.85), rgba(175,82,222,.70));
    }

    .blank input{
      height: 40px;
      border-radius: var(--radiusSm);
      border: 1px dashed rgba(0,122,255,.55);
      background: rgba(0,122,255,.06);
      padding: 0 10px;
      font-family: var(--mono);
      font-size: var(--sql);
      outline:none;
      text-transform: uppercase;
      min-width: 160px;
    }
    .blank input:focus{
      box-shadow: var(--focus);
      border-style: solid;
      background: rgba(255,255,255,.90);
    }

    .feedback{
      margin-top: 10px;
      padding: 12px 12px;
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.80);
      color: rgba(11,15,24,.86);
      font-size: var(--small);
      line-height: 1.45;
      white-space: pre-line;
      display:none;
      box-shadow: var(--shadow2);
    }
    .feedback.ok{
      border-color: rgba(52,199,89,.22);
      background: linear-gradient(180deg, rgba(52,199,89,.10), rgba(255,255,255,.76));
    }
    .feedback.bad{
      border-color: rgba(255,149,0,.22);
      background: linear-gradient(180deg, rgba(255,149,0,.10), rgba(255,255,255,.76));
    }
    .feedback.show{display:block}

    .codeEditor{
      width: 100%;
      min-height: 180px;
      border-radius: var(--radiusSm);
      border: 1px solid rgba(0,122,255,.22);
      background: rgba(255,255,255,.92);
      padding: 12px;
      font-family: var(--mono);
      font-size: var(--sql);
      line-height: 1.65;
      outline: none;
      resize: vertical;
    }
    .codeEditor:focus{
      box-shadow: var(--focus);
      border-color: rgba(0,122,255,.45);
    }

    .shopPreview{
      margin-top: 14px;
      border-radius: var(--radiusMd);
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.80);
      box-shadow: var(--shadow2);
      overflow: hidden;
    }
    .shopPreviewHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      background: rgba(0,122,255,.08);
      font-size: var(--small);
      font-weight: 950;
      color: rgba(11,15,24,.88);
    }
    .shopPreviewFrame{
      width: 100%;
      height: 440px;
      border: 0;
      display: block;
      background: white;
    }

    .codeLayout{
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(360px, 2fr);
      gap: 14px;
      align-items: start;
    }
    .codeLeft{min-width: 0;}
    .codeRight{min-width: 0;}


    .codeLayout.codeSplit{
      grid-template-columns: minmax(420px, 2fr) minmax(320px, 1fr);
    }
    .codeLayout.codeSplit .shopPreviewFrame{
      height: 560px;
    }


/* Code-Aufgaben: deutlicher Split + modernere Panels */
.codeTaskSplit{
  gap: 0;
  border-radius: var(--radiusLg);
  overflow: hidden;
  border: 2px solid rgba(10,15,24,.12);
  background: rgba(255,255,255,.60);
  box-shadow: 0 24px 70px rgba(10,15,24,.10);
}

/* Stretch split panes so the purple divider reaches full card height */
.codeLayout.codeTaskSplit{ align-items: stretch !important; }
.codeLayout.codeTaskSplit > .codeLeft,
.codeLayout.codeTaskSplit > .codeRight{ align-self: stretch; }
.codeLayout.codeTaskSplit .splitPane{ height: 100%; display:flex; flex-direction: column; }

.codeTaskSplit .splitPane{
  border-radius: 0;
  padding: 14px;
  min-height: 0;
}
.codeTaskSplit .splitPaneShop{
  background: linear-gradient(180deg, rgba(0,122,255,.10), rgba(255,255,255,.86));
}

.codeTaskSplit .splitPaneShop .shopPreviewHead{ display:none; }
.codeTaskSplit .splitPaneLab{
  background: linear-gradient(180deg, rgba(175,82,222,.12), rgba(255,255,255,.92));
  border-left: 10px solid rgba(175,82,222,.28);
  box-shadow: inset 2px 0 0 rgba(10,15,24,.10);
}
.splitPaneTop{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap: 10px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(10,15,24,.10);
}
.splitPaneTitle{
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-weight: 950;
  color: rgba(11,15,24,.72);
}
.splitPaneHint{
  font-size: 12px;
  font-weight: 800;
  color: rgba(11,15,24,.55);
  white-space: nowrap;
}
.taskCardTight{
  padding: 12px;
  border-color: rgba(10,15,24,.12);
  box-shadow: 0 14px 34px rgba(10,15,24,.08);
  /* allow horizontal scroll so blanks are never clipped */
  overflow: auto;
}

pre.sql.sqlFill{
  /* inputs are taller than the default line-height; prevent vertical clipping */
  line-height: 2.7;
  min-width: max-content;
}
pre.sql.sqlFill .blank input{
  vertical-align: middle;
  display: inline-block;
}
@media (max-width: 980px){
  .codeTaskSplit{
    grid-template-columns: 1fr;
  }
  .codeTaskSplit .splitPaneLab{
    border-left: 0;
    border-top: 10px solid rgba(175,82,222,.28);
  }
  .splitPaneHint{ white-space: normal; }
}

    .matchGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    .matchCol{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.72);
      border-radius: var(--radiusMd);
      padding: 12px;
      box-shadow: var(--shadow2);
    }
    .matchTitle{
      font-size: var(--small);
      font-weight: 950;
      color: rgba(11,15,24,.88);
      margin: 2px 0 10px;
    }
    .chip{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.82);
      border-radius: var(--radiusMd);
      padding: 12px 12px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      user-select:none;
      font-size: var(--small);
      color: rgba(11,15,24,.92);
      display:flex;
      justify-content:space-between;
      gap: 10px;
      align-items:center;
      margin-bottom: 10px;
      outline:none;
    }
    .chip:hover{transform: translateY(-1px); box-shadow: 0 16px 28px rgba(10,15,24,.08)}
    .chip:focus{box-shadow: var(--focus), 0 16px 28px rgba(10,15,24,.08)}
    .chip.selected{
      border-color: rgba(0,122,255,.38);
      background: rgba(0,122,255,.08);
    }
    .chip .tag{
      font-family: var(--mono);
      font-weight: 900;
      color: rgba(0,122,255,.92);
      white-space:nowrap;
    }

    .btnRow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top: 16px;
    }
    .btn{
      border: 1px solid var(--hair2);
      background: rgba(255,255,255,.82);
      color: rgba(11,15,24,.92);
      padding: 12px 14px;
      border-radius: var(--radiusMd);
      font-weight: 950;
      font-size: var(--small);
      cursor:pointer;
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease, opacity .2s ease;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); box-shadow: 0 16px 28px rgba(10,15,24,.08)}
    .btn:active{transform: translateY(0px)}
    .btn:focus{outline:none; box-shadow: var(--focus), 0 16px 28px rgba(10,15,24,.08)}
    .btn.primary{
      border-color: rgba(0,122,255,.22);
      background: linear-gradient(180deg, rgba(0,122,255,.14), rgba(175,82,222,.06));
    }
    .btn.ghost{background: rgba(255,255,255,.66);}
    .btn.disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none !important;
      box-shadow:none !important;
    }

    .progressWrap{
      padding: 14px 22px;
      border-top: 1px solid var(--hair2);
      background: rgba(255,255,255,.44);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .progress{
      flex:1;
      height: 10px;
      border-radius: 999px;
      background: rgba(10,15,24,.08);
      overflow:hidden;
    }
    .bar{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(0,122,255,1), rgba(175,82,222,.90), rgba(255,45,85,.75));
      border-radius: 999px;
      transition: width .25s ease;
    }
    .stepTxt{font-size: var(--small); color: var(--muted)}
    .stepTxt b{color: var(--text); font-weight: 950}

    @media (prefers-reduced-motion: reduce){
      .btn, .chip, .pillBtn, .bar{transition:none !important}
      .btn:hover, .chip:hover, .pillBtn:hover{transform:none !important}
    }

    @media (max-width: 560px){
      .shell{padding: 6px 4px 8px}
      .cardInner{padding: 18px}

<script>
  const el = (id) => document.getElementById(id);

  function escapeHtml(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function escapeAttr(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;").replaceAll('"',"&quot;")
      .replaceAll("<","&lt;").replaceAll(">","&gt;");
  }
  function normalize(str){
    return (str ?? "").toString().trim()
      .replace(/;+$/,"")
      .replace(/\s+/g," ")
      .toLowerCase();
  }

  function testAll(sql, regs){
    const s = normalize(sql);
    return regs.every((re) => re.test(s));
  }

  function testAny(sql, regs){
    const s = normalize(sql);
    return regs.some((re) => re.test(s));
  }

  function getName(){
    const qp = new URLSearchParams(location.search);
    return (qp.get("name") || "").trim();
  }

  const state = { name: getName(), i: 0 };
  const __codeAttempts = Object.create(null);
  const logger = window.studyLogger;
  try{ logger?.ensureStudentIdFromName(state.name); }catch(_){}
  const UNLOCK_KEY = "schulazon_unlocked_v1";
  let shopFrame = null;
  let shopReady = false;
  let currentTargetTaskId = null;

  function getUnlockMap(){
    try { return JSON.parse(localStorage.getItem(UNLOCK_KEY) || "{}"); }
    catch { return {}; }
  }
  function setUnlockMap(map){
    try { localStorage.setItem(UNLOCK_KEY, JSON.stringify(map || {})); } catch {}
  }
  function isTaskUnlocked(id){
    if(!id) return false;
    const map = getUnlockMap();
    return !!map[id];
  }
  function unlockTask(id){
    if(!id) return;
    const map = getUnlockMap();
    if(map[id]) return;
    map[id] = true;
    setUnlockMap(map);
    applyUnlocksToShop();
  }

  function sendShopLock(taskId, locked){
    if(!shopFrame || !shopFrame.contentWindow) return;
    shopFrame.contentWindow.postMessage(
      { __SCHULAZON__: true, type: "SET_LOCK", taskId, locked },
      window.location.origin
    );
  }

  function applyUnlocksToShop(){
    if(!shopFrame || !shopReady) return;
    const map = getUnlockMap();
    Object.keys(map).forEach((id) => {
      if(map[id]) sendShopLock(id, false);
    });
    highlightShopTarget(currentTargetTaskId);
  }

  window.addEventListener("message", (e) => {
    if(e.origin !== window.location.origin) return;
    const msg = e.data;
    if(!msg || msg.__SCHULAZON__ !== true) return;
    if(msg.type === "SHOP_READY"){
      shopReady = true;
      applyUnlocksToShop();
    }
  });

  function withName(s){
    if(!state.name) return s;
    return `${state.name}, ${s}`;
  }

    if(!state.name) return text;
    const n = state.name.toLowerCase();

    if(Array.isArray(text)){
      if(!text.length) return text;
      const first = (text[0] ?? "").toString();
      if(first.trim().toLowerCase().startsWith(n)) return text;
      return [ `${state.name}, ${first}`, ...text.slice(1) ];
    }
    if(typeof text === "string"){
      const t = text.trim();
      if(!t) return text;
      if(t.toLowerCase().startsWith(n)) return text;
      return `${state.name}, ${text}`;
    }
    return text;
  }

    if(state.name){
      el("pillName").style.display = "flex";

  /* ---------- SQL Highlighting (robust) ---------- */
  const KW_SET = new Set([
    "SELECT","FROM","WHERE","ORDER BY","GROUP BY","HAVING","DISTINCT","LIMIT",
    "COUNT","SUM","AVG","MIN","MAX","AS","AND","OR","NOT","ASC","DESC"
  ]);

  function isNumberToken(t){ return /^\d+$/.test(t); }
  function isOpToken(t){ return /^(<=|>=|<>|=|<|>)$/.test(t); }
  function isWordToken(t){ return /^[A-Za-z_][A-Za-z0-9_]*$/.test(t); }

  function highlightSqlLine(line, marks){
    const raw = (line ?? "").toString();
    if(raw.trim().startsWith("--")) return `<span class="cm">${escapeHtml(raw)}</span>`;

    const re = /(\bORDER\s+BY\b|\bGROUP\s+BY\b|\bASC\b|\bDESC\b|<=|>=|<>|=|<|>|\b\d+\b|\b[A-Za-z_][A-Za-z0-9_]*\b|\s+|.)/gi;
    const out = [];
    let m;

    while((m = re.exec(raw)) !== null){
      const tok = m[0];

      if(/^\s+$/.test(tok)){ out.push(escapeHtml(tok)); continue; }
      if(isOpToken(tok)){ out.push(`<span class="op">${escapeHtml(tok)}</span>`); continue; }
      if(isNumberToken(tok)){ out.push(`<span class="num">${escapeHtml(tok)}</span>`); continue; }

      const up = tok.toUpperCase().replace(/\s+/g, " ");
      if(KW_SET.has(up)){ out.push(`<span class="kw">${escapeHtml(tok)}</span>`); continue; }

      if(isWordToken(tok) && tok.toUpperCase() !== "NULL"){
        const key = tok.toLowerCase();
        if(marks && marks[key]){
          out.push(`<span class="${marks[key]}">${escapeHtml(tok)}</span>`);
        } else {
          out.push(`<span class="id">${escapeHtml(tok)}</span>`);
        }
        continue;
      }

      out.push(escapeHtml(tok));
    }

    return out.join("");
  }

  function renderSql(lines, toneClass="tone-blue", marks=null){
    if(!lines || !lines.length) return "";
    return `
      <div class="schemaWrap">
        <div class="schemaLabel ${toneClass}">SQL</div>
        <div class="codeBox"><pre class="sql">${lines.map(l=>highlightSqlLine(l, marks)).join("\n")}</pre></div>
      </div>
    `;
  }

  /* ---------- Theory highlighting (ONLY key terms) ---------- */
  const THEORY_CODE = new Set([
    "SELECT","FROM","WHERE","ORDER BY","GROUP BY","HAVING","DISTINCT","LIMIT","AND","OR","NOT",
    "COUNT","SUM","AVG","MIN","MAX","AS","ASC","DESC"
  ]);

  const THEORY_RE = new RegExp(
    [
      "\\bORDER\\s+BY\\b",
      "\\bGROUP\\s+BY\\b",
      "\\bASC\\b","\\bDESC\\b",
      "\\bSELECT\\b","\\bFROM\\b","\\bWHERE\\b","\\bHAVING\\b","\\bDISTINCT\\b","\\bLIMIT\\b",
      "\\bCOUNT\\b","\\bSUM\\b","\\bAVG\\b","\\bMIN\\b","\\bMAX\\b","\\bAS\\b",
      "\\bAND\\b","\\bOR\\b","\\bNOT\\b",
      "\\bPrimärschlüssel\\b",
      "\\bFremdschlüssel\\b",
      "\\bBeziehungstabelle\\b",
      "personenbezogene Daten",
      "Datenschutz\\-Grundverordnung",
      "\\b1:n\\b","\\bn:m\\b"
    ].join("|"),
    "gi"
  );

  function highlightTheoryText(escapedText){
    return escapedText.replace(THEORY_RE, (match)=>{
      const lower = match.toLowerCase();
      if(lower.includes("primärschlüssel")) return `<span class="hiPK">${match}</span>`;
      if(lower.includes("fremdschlüssel")) return `<span class="hiFK">${match}</span>`;

      const norm = match.toUpperCase().replace(/\s+/g, " ");
      const isCode = THEORY_CODE.has(norm);
      return isCode ? `<span class="hiCode">${match}</span>` : `<span class="hi">${match}</span>`;
    });
  }

  function renderTheory(text, head="Theorie", variant="theory"){
    if(!text) return "";
    const body = Array.isArray(text)
      ? text.map(p=>`<p>${highlightTheoryText(escapeHtml(p))}</p>`).join("")
      : `<p>${highlightTheoryText(escapeHtml(text))}</p>`;

    const cls = (variant === "task") ? "theory taskBlock" : "theory";
    return `
      <section class="${cls}" aria-label="${escapeAttr(head)}">
        <div class="theoryHead">${escapeHtml(head)}</div>
        <div class="theoryBody">${body}</div>
      </section>
    `;
  }

  function renderStory(lines){
    if(!lines) return "";
    const html = Array.isArray(lines)
      ? lines.map(x=>`<p>${escapeHtml(x)}</p>`).join("")

    return `
      <section class="theory" aria-label="Kontext">
        <div class="theoryHead">Kontext</div>
        <div class="theoryBody">${html}</div>
      </section>

  /* ---------- Answer checking with alternatives (||) ---------- */
  function isCorrectAnswer(got, wantRaw){
    const gotN = normalize(got).toUpperCase();
    const raw = (wantRaw ?? "").toString();
    if(raw.includes("__ANY__")) return gotN.length > 0;
    const wants = raw
      .split("||")
      .map(x => normalize(x).toUpperCase())
      .filter(Boolean);
    return wants.includes(gotN);
  }

    const denom = Math.max(1, total - 1);
    el("bar").style.width = `${(state.i / denom) * 100}%`;
    updateNamePill();
  }

  function renderFill(p){

    const tpl = p.template.map(part=>{
      if(typeof part === "string") return escapeHtml(part);
      return `<span class="blank"><input data-answer="${escapeAttr(part.blank)}" type="text" placeholder="..." autocomplete="off" spellcheck="false"/></span>`;
    }).join("");

    el("screen").innerHTML = `
      <h2 class="qTitle">${escapeHtml(p.title)}</h2>

        <button class="btn ghost" id="backBtn">Zurück</button>
        <button class="btn primary disabled" id="nextBtn">Verstanden</button>
      </div>
    `;

    const input = document.querySelector(".blank input");
    const fb = el("fb");
    const nextBtn = el("nextBtn");

    el("backBtn").addEventListener("click", ()=>{ state.i--; render(); });

    el("checkBtn").addEventListener("click", ()=>{
      const ok = isCorrectAnswer(input.value, input.dataset.answer);
      fb.textContent = ok ? p.feedbackOk : p.feedbackNo;
      fb.classList.add("show");
      fb.classList.toggle("ok", ok);
      fb.classList.toggle("bad", !ok);
      nextBtn.classList.toggle("disabled", !ok);
      if(ok) nextBtn.focus(); else input.focus();
    });

    nextBtn.addEventListener("click", ()=>{
      if(nextBtn.classList.contains("disabled")) return;
      state.i++; render();
    });

    setTimeout(()=>input.focus(), 30);
  }

  function buildSqlFromTemplate(template, inputs){
    let out = "";
    let i = 0;
    for(const part of (template || [])){
      if(typeof part === "string") out += part;
      else { out += (inputs[i]?.value ?? ""); i++; }
    }
    return out;
  }

    const ctx = p.nameInPrompt ? addNamePrefixText(p.context) : p.context;
    const alreadyUnlocked = !!p.unlockTaskId && isTaskUnlocked(p.unlockTaskId);
    const isFill = Array.isArray(p.template);

    if(isFill){
      const tpl = p.template.map(part=>{
        if(typeof part === "string") return escapeHtml(part);
        return `<span class="blank"><input data-answer="${escapeAttr(part.blank)}" type="text" placeholder="." autocomplete="off" spellcheck="false"/></span>`;
      }).join("");

      el("screen").innerHTML = `
  <h2 class="qTitle">${escapeHtml(p.title)}</h2>
  ${renderTheory(ctx, "Aufgabe", "task")}
  <div class="codeLayout codeSplit codeTaskSplit">
    <div class="codeLeft">
      <div class="splitPane splitPaneShop">
        <div class="splitPaneTop">
          <div class="splitPaneTitle">Shop</div>
          <div class="splitPaneHint">Ziel-Button: markiert</div>
        </div>
        ${renderShopPreview()}
      </div>
    </div>
    <div class="codeRight">
      <div class="splitPane splitPaneLab">
        <div class="splitPaneTop">
          <div class="splitPaneTitle">SQL</div>
          <div class="splitPaneHint">Fülle die Lücke(n) aus</div>
        </div>
        <div class="taskCard taskCardTight"><pre class="sql sqlFill">${tpl}</pre></div>
        <button class="btn ${alreadyUnlocked ? "disabled":""}" id="checkBtn" style="margin-top:12px;">
          ${alreadyUnlocked ? "Bereits freigeschaltet" : "Prüfen"}
        </button>
        <div class="feedback ${alreadyUnlocked ? "show ok":""}" id="fb">${alreadyUnlocked ? escapeHtml(p.feedbackOk || "Bereits freigeschaltet.") : ""}</div>
      </div>
    </div>
  </div>
  <div class="btnRow">
    <button class="btn ghost" id="backBtn">Zurück</button>
    <button class="btn primary ${alreadyUnlocked ? "" : "disabled"}" id="nextBtn">Verstanden</button>
  </div>
`;

currentTargetTaskId = p.unlockTaskId || null;
currentTargetTaskId = p.unlockTaskId || null;
      bindShopPreview();

      const inputs = [...document.querySelectorAll(".codeRight .blank input")];
      const fb = el("fb");
      const nextBtn = el("nextBtn");
      const checkBtn = el("checkBtn");

      el("backBtn").addEventListener("click", ()=>{ state.i--; render(); });

      if(checkBtn){
        checkBtn.addEventListener("click", ()=>{
          if(alreadyUnlocked) return;

          const blanksOk = inputs.every(inp => isCorrectAnswer(inp.value, inp.dataset.answer));
          const builtSql = buildSqlFromTemplate(p.template, inputs);
          const extraOk = (typeof p.check === "function") ? !!p.check(builtSql) : true;
          const ok = blanksOk && extraOk;

          // Always show feedback; after 3 failed tries show solution, before that show tips.
let msg = ok ? (p.feedbackOk || "Korrekt.") : (p.feedbackNo || "Noch nicht korrekt.");
if(!ok){
  __codeAttempts[p.id] = (__codeAttempts[p.id] || 0) + 1;
  const n = __codeAttempts[p.id];
  const hints = Array.isArray(p.hints) ? p.hints : [];
  if(n >= 3 && p.solution){
    msg = `Musterlösung:\n${p.solution}`;
  } else if(hints[n-1]){
    msg = `Tipp ${n}/2: ${hints[n-1]}`;
  }
}

if(ok && p.showShop){
  msg = `${msg}
Teste den Button nun im Shop.`;
}

fb.textContent = msg;
fb.classList.add("show");
fb.classList.toggle("ok", ok);
fb.classList.toggle("bad", !ok);
fb.style.display = "block";
try{ fb.scrollIntoView({block:"nearest"}); }catch(_){ }

          if(ok){
            unlockTask(p.unlockTaskId);
            checkBtn.classList.add("disabled");
            checkBtn.textContent = "Freigeschaltet";
            nextBtn.classList.remove("disabled");
            nextBtn.focus();
          } else {
            const firstBad = inputs.find(inp => !isCorrectAnswer(inp.value, inp.dataset.answer));
            (firstBad || inputs[0])?.focus();
          }
        });
      }

      nextBtn.addEventListener("click", ()=>{
        if(nextBtn.classList.contains("disabled")) return;
        state.i++; render();
      });

      setTimeout(()=>inputs[0]?.focus(), 30);
      return;
    }

    /* Fallback: Textarea-Code-Task (Kompatibilität) */
    el("screen").innerHTML = `
      <h2 class="qTitle">${escapeHtml(p.title)}</h2>
      ${renderTheory(ctx, "Programmieraufgabe", "task")}
      <div class="codeLayout">
        <div class="codeLeft">
          <div class="taskCard">
            <div style="font-size: var(--small); font-weight: 950; margin-bottom:8px; color: rgba(11,15,24,.86);">Deine SQL</div>
            <textarea id="codeInput" class="codeEditor" spellcheck="false" autocomplete="off" autocapitalize="off">${escapeHtml(p.starter || "")}</textarea>
          </div>
          <button class="btn ${alreadyUnlocked ? "disabled":""}" id="checkBtn" style="margin-top:12px;">
            ${alreadyUnlocked ? "Bereits freigeschaltet" : "Prüfen & freischalten"}
          </button>
          <div class="feedback ${alreadyUnlocked ? "show ok":""}" id="fb">${alreadyUnlocked ? escapeHtml(p.feedbackOk || "Bereits freigeschaltet.") : ""}</div>
        </div>
        <div class="codeRight">
          ${p.showShop ? renderShopPreview() : ``}
        </div>
      </div>
      <div class="btnRow">
        <button class="btn ghost" id="backBtn">Zurück</button>
        <button class="btn primary ${alreadyUnlocked ? "" : "disabled"}" id="nextBtn">Verstanden</button>
      </div>
    `;

    currentTargetTaskId = p.unlockTaskId || null;
    if(p.showShop) bindShopPreview();
    else { shopFrame = null; shopReady = false; currentTargetTaskId = null; }

    const input = el("codeInput");
    const fb = el("fb");
    const nextBtn = el("nextBtn");
    const checkBtn = el("checkBtn");

    el("backBtn").addEventListener("click", ()=>{ state.i--; render(); });

    if(checkBtn){
      checkBtn.addEventListener("click", ()=>{
        if(alreadyUnlocked) return;
        const res = (typeof p.check === "function") ? p.check(input.value) : false;
        const ok = (typeof res === "object") ? !!res.ok : !!res;
        const okMsg = (typeof res === "object" && res.okMsg) ? res.okMsg : p.feedbackOk;
        const noMsg = (typeof res === "object" && res.noMsg) ? res.noMsg : p.feedbackNo;

        let msg = ok ? okMsg : noMsg;
        if(ok && p.showShop){ msg = `${msg}
Teste den Button nun im Shop.`; }
        fb.textContent = msg;
        fb.classList.add("show");
        fb.classList.toggle("ok", ok);
        fb.classList.toggle("bad", !ok);
        fb.style.display = "block";
        try{ fb.scrollIntoView({block:"nearest"}); }catch(_){ }

        if(ok){
          unlockTask(p.unlockTaskId);
          checkBtn.classList.add("disabled");
          checkBtn.textContent = "Freigeschaltet";
          nextBtn.classList.remove("disabled");
          nextBtn.focus();
        } else {
          input.focus();
        }
      });
    }

    nextBtn.addEventListener("click", ()=>{
      if(nextBtn.classList.contains("disabled")) return;
      state.i++; render();
    });

    setTimeout(()=>input?.focus(), 30);
  }


function renderMatch(p){
    const theory = p.nameInPrompt ? addNamePrefixText(p.theory) : p.theory;

    const right = p.right.slice();
    for(let i=right.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [right[i], right[j]] = [right[j], right[i]];
    }

    const pairs = new Map();
    let selL = null, selR = null;

    el("screen").innerHTML = `
      <h2 class="qTitle">${escapeHtml(p.title)}</h2>
      ${renderTheory(theory, "Aufgabe", "task")}
      <div class="matchGrid">
        <div class="matchCol">
          <div class="matchTitle">Baustein</div>
          ${p.left.map(x=>`
            <div class="chip" data-side="L" data-key="${escapeAttr(x.key)}" tabindex="0">
              <span class="tag">${escapeHtml(x.label)}</span>
              <span style="opacity:.62">wählen</span>
            </div>
          `).join("")}
        </div>
        <div class="matchCol">
          <div class="matchTitle">Zweck</div>
          ${right.map(x=>`
            <div class="chip" data-side="R" data-key="${escapeAttr(x.key)}" tabindex="0">
              <span>${escapeHtml(x.label)}</span>
              <span style="opacity:.62">wählen</span>
            </div>
          `).join("")}
        </div>
      </div>
      <div class="schemaWrap">
        <div class="schemaLabel tone-blue">Status</div>
        <div class="codeBox" id="statusBox"></div>
      </div>
      <div class="btnRow">
        <button class="btn ghost" id="backBtn">Zurück</button>
        <button class="btn primary disabled" id="nextBtn">Verstanden</button>
      </div>
    `;

    const statusBox = el("statusBox");
    const nextBtn = el("nextBtn");

    function draw(){
      statusBox.innerHTML = p.left.map(item=>{
        const rk = pairs.get(item.key);
        const ok = rk && rk === item.key;
        const rightLabel = rk ? (p.right.find(x=>x.key===rk)?.label || "") : "—";
        return `<div style="display:flex; gap:10px; align-items:center; padding:10px 10px; border-radius:14px; border:1px solid rgba(10,15,24,.06); background: rgba(10,15,24,.02); margin-bottom:8px;">
          <div style="width:10px;height:10px;border-radius:999px;background:${ok ? "rgba(52,199,89,.92)" : "rgba(10,15,24,.22)"}"></div>
          <div style="flex:1; font-weight:950">${escapeHtml(item.label)}</div>
          <div style="flex:2; color: rgba(11,15,24,.76)">${escapeHtml(rightLabel)}</div>
        </div>`;
      }).join("");

      const allSet = p.left.every(x => pairs.get(x.key));
      const allOk = p.left.every(x => pairs.get(x.key) === x.key);
      nextBtn.classList.toggle("disabled", !(allSet && allOk));
    }

    function setSelected(side, key){
      document.querySelectorAll(`.chip[data-side="${side}"]`).forEach(n=>{
        n.classList.toggle("selected", n.dataset.key === key);
      });
    }

    function pick(side, key){
      if(side==="L"){ selL = key; setSelected("L", key); }
      else { selR = key; setSelected("R", key); }

      if(selL && selR){
        pairs.set(selL, selR);
        selL = null; selR = null;
        setSelected("L","");
        setSelected("R","");
        draw();
      }
    }

    document.querySelectorAll(".chip").forEach(node=>{
      const handler = ()=> pick(node.dataset.side, node.dataset.key);
      node.addEventListener("click", handler);
      node.addEventListener("keydown",(e)=>{
        if(e.key==="Enter" || e.key===" "){ e.preventDefault(); handler(); }
      });
    });

    el("backBtn").addEventListener("click", ()=>{ state.i--; render(); });
    nextBtn.addEventListener("click", ()=>{
      if(nextBtn.classList.contains("disabled")) return;
      state.i++; render();
    });

    draw();
  }

  function renderAck(p){
    const theoryText = p.nameInTheory ? addNamePrefixText(p.theory) : p.theory;

    el("screen").innerHTML = `
      <h2 class="qTitle">${escapeHtml(p.title)}</h2>
      ${theoryText ? renderTheory(theoryText) : ``}

      <button class="btn primary" id="ackBtn" style="width:100%; margin-top: 6px;">${escapeHtml(p.ackLabel || "Verstanden")}</button>

      <div class="btnRow">
        <button class="btn ghost ${state.i===0 ? "disabled":""}" id="backBtn">Zurück</button>
        <button class="btn disabled" id="nextBtn">${escapeHtml(p.nextLabel || "Weiter")}</button>
      </div>
    `;

    const nextBtn = el("nextBtn");
    const ackBtn = el("ackBtn");

    el("backBtn").addEventListener("click", ()=>{
      if(state.i===0) return;
      state.i--; render();
    });

    ackBtn.addEventListener("click", ()=>{
      ackBtn.classList.add("disabled");
      ackBtn.textContent = (p.ackLabel || "Verstanden") + " ✓";
      nextBtn.classList.remove("disabled");
      nextBtn.classList.add("primary");
      nextBtn.focus();
    });

    nextBtn.addEventListener("click", ()=>{
      if(nextBtn.classList.contains("disabled")) return;
      state.i++;
      if(state.i >= pages.length) state.i = pages.length-1;
      render();
    });
  }

  
function bindKeyToggles(){
  const screen = el("screen");
  const pkBtn = document.getElementById("togglePK");
  const fkBtn = document.getElementById("toggleFK");
  if(!screen || !pkBtn || !fkBtn) return;

  // default: Markierungen an
  screen.classList.remove("pkOff","fkOff");

  const sync = () => {
    pkBtn.textContent = screen.classList.contains("pkOff") ? "PK: aus" : "PK: an";
    fkBtn.textContent = screen.classList.contains("fkOff") ? "FK: aus" : "FK: an";
  };

  pkBtn.addEventListener("click", () => {
    screen.classList.toggle("pkOff");
    sync();
  });
  fkBtn.addEventListener("click", () => {
    screen.classList.toggle("fkOff");
    sync();
  });

  sync();
}

function renderInfo(p){
    const story = p.story ? renderStory(p.story) : "";
    const recap = p.recapHtml ? renderRecap(p.recapHtml) : "";
    const theoryText = p.theory ? (p.nameInTheory ? addNamePrefixText(p.theory) : p.theory) : null;

    el("screen").innerHTML = `
      <h2 class="qTitle">${escapeHtml(p.title)}</h2>
      ${story}
      ${recap}
      ${theoryText ? renderTheory(theoryText) : ``}
      ${p.table ? p.table : ``}
      ${p.sql ? renderSql(p.sql, p.sqlTone || "tone-blue", p.sqlMarks || null) : ``}
      ${p.afterSql ? p.afterSql : ``}
      <div class="btnRow">
        <button class="btn ghost ${state.i===0 ? "disabled":""}" id="backBtn">Zurück</button>
        <button class="btn primary" id="nextBtn">Verstanden</button>
      </div>
    `;

    el("backBtn").addEventListener("click", ()=>{
      if(state.i===0) return;
      state.i--; render();
    });
    el("nextBtn").addEventListener("click", ()=>{
      state.i++;
      if(state.i >= pages.length) state.i = pages.length-1;
      render();
    });

    if(p.finish){
      const btn = el("nextBtn");
      if(btn){
        const clone = btn.cloneNode(true);
        clone.textContent = "Zum freien Modus";
        clone.classList.add("primary");
        clone.classList.remove("disabled");
        btn.parentNode.replaceChild(clone, btn);
        clone.addEventListener("click", goToFreeMode);
      }
    }

    if(p.id === "rel_bundle"){ bindKeyToggles(); }

  }

  function render(){
    updateHeader();
    try{ el("screen").classList.remove("pkOff","fkOff"); }catch(_){ }
    shopFrame = null;
    shopReady = false;
    currentTargetTaskId = null;
    const p = pages[state.i];

    if(p.type === "match"){ renderMatch(p); return; }
    if(p.type === "fill"){ renderFill(p); return; }
    if(p.type === "fill_multi"){ renderFillMulti(p); return; }
    if(p.type === "code"){ renderCodeTask(p); return; }
    if(p.type === "ack"){ renderAck(p); return; }

    renderInfo(p);
  }

  function goToFreeMode(){
    const n = (state.name || "").toString().trim();
    try { sessionStorage.setItem("schulazon_skip_reset_v1", "true"); } catch {}
    const url = "free.html" + (n ? `?name=${encodeURIComponent(n)}` : "");
    try{ logger?.logEvent("route_to_free", { from: "tutorial" }); }catch(_){}
    window.location.href = url;
  }

  function goHomeConfirm(){
    const ok = window.confirm("Willst du wirklich zur Startseite? Alle aktuellen Spielstände gehen verloren.");
    if(!ok) return;
    window.location.href = "index.html";
  }

  async function toggleFullscreen(){
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch{}
  }

  el("fsBtn").addEventListener("click", toggleFullscreen);
  el("homeBtn")?.addEventListener("click", goHomeConfirm);
  el("exitBtn")?.addEventListener("click", goToFreeMode);
  document.addEventListener("fullscreenchange", ()=>{
    el("fsBtn").textContent = document.fullscreenElement ? "Vollbild aus" : "Vollbild";
  });

  (function resetTutorialOnLoad(){
    try{ localStorage.removeItem(UNLOCK_KEY); }catch{}
    try{ for(const k in __codeAttempts) delete __codeAttempts[k]; }catch{}
  })();

  updateNamePill();
  render();
</script>
</body>
