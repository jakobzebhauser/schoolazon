<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Schulazon – Lernplattform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<script>
  // Nur wenn shop.html im iframe läuft
  if (window.self !== window.top) {
    document.documentElement.classList.add("embed");
  }
</script>


<body>
  <div class="app">

    <!-- ======================================================
         LINKER BEREICH – SHOP (UNVERÄNDERT)
         ====================================================== -->
    <div class="browser">

      <!-- ================= WARENKORB ================= -->
      <div class="cart-overlay" id="cartOverlay"></div>

      <aside class="cart-panel" id="cartPanel">
        <div class="cart-header">
          <h3>🛒 Warenkorb</h3>
          <button class="cart-close" id="cartClose">✕</button>
        </div>

        <div class="cart-body" id="cartContent">
          <p class="cart-hint">Warenkorb laden…</p>
        </div>

        <div class="cart-footer">
          <button class="cart-btn primary" id="btnShowCart">Warenkorb aktualisieren</button>
          <button class="cart-btn secondary" id="btnTotal">Gesamtpreis aktualisieren</button>
          <div class="cart-total" id="cartTotal"></div>
        </div>
      </aside>

      <!-- ================= KONTO ================= -->
      <div class="account-overlay" id="accountOverlay"></div>

      <aside class="account-panel" id="accountPanel">
        <div class="account-header">
          <div>
            <div class="account-title">👤 Konto & Listen</div>
            <div class="account-user">Anna Müller</div>
          </div>
          <button class="account-close" id="accountClose">✕</button>
        </div>

        <div class="account-body">

<!-- Login (für spätere SQLi-Aufgabe) -->
<section class="account-block">
  <h4>🔐 Mit anderem Konto anmelden</h4>

  <input class="account-input" id="loginUser" placeholder="Benutzername" />
  <input class="account-input" id="loginPass" placeholder="Passwort" type="password" />

  <button type="button" class="account-btn" id="btnLogin">Einloggen</button>

  <!-- Statusanzeige -->
  <div class="login-status" id="loginStatus">
    Nicht angemeldet
  </div>
</section>


  <!-- Bestellungen -->
  <section class="account-block">
  <button type="button" class="account-btn primary" id="btnOrders">
    📦 Meine Bestellungen anzeigen
  </button>

  <div class="account-list" id="ordersResult"></div>
</section>


  <!-- Top-Produkte -->
  <section class="account-block">
  <button type="button" class="account-btn secondary" id="btnTopProducts">
    ⭐ Meine Top-Produkte anzeigen
  </button>

  <div class="account-list" id="topProductsResult"></div>
</section>


 

</div>

      </aside>

      <!-- ================= Fake-Browser-Leiste ================= -->
      <div class="browser-bar">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <div class="url">https://www.schulazon.de</div>
      </div>

      <!-- ================= SHOP ================= -->
      <div class="shop">

        <!-- HEADER -->
        <div class="shop-header">
          <div class="logo">schul<span>azon</span></div>

          <div class="search">
            <input id="searchInput" type="search" placeholder="Produkte suchen…" />
            <button id="searchClear">✕</button>
          </div>

          <div class="profile">
            Hallo, Anna<br><strong>Konto & Listen</strong>
          </div>

          <div class="profile cart-trigger">
      <span class="cart-icon">
    🛒
    <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
  </span>
  <br><strong>Warenkorb</strong>
          </div>
</div>


        <!-- SHOP-BAR -->
        <div class="shop-bar">
          <div class="shop-actions left">
            <button class="shop-btn" data-task="all">Alle Produkte</button>

            <!-- Expresslieferung jetzt NORMAL -->
            <button class="shop-btn" data-task="express">Expresslieferung</button>

            <button class="shop-btn" data-task="bestseller">Bestseller</button>
            <button class="shop-btn" data-task="available">Nur noch wenige auf Lager</button>
          </div>

          <div class="shop-actions right">
            <div class="sort-dropdown" id="sortDropdown">
              <div class="sort-selected">⇅ Sortieren ▾</div>
              <div class="sort-options">
                <div class="sort-option" data-task="priceAsc">Preis ↑</div>
                <div class="sort-option" data-task="priceDesc">Preis ↓</div>
                <div class="sort-option" data-task="popularity">Beliebtheit</div>
              </div>
            </div>
          </div>
        </div>

        <!-- INHALT -->
        <div class="shop-content">
          <aside class="filters">

            <div class="filter-section">
              <div class="filter-title">Kategorie</div>
              <button class="filter-btn" data-task="cat-electronics">Elektronik</button>
              <button class="filter-btn" data-task="cat-household">Haushalt</button>
              <button class="filter-btn" data-task="cat-sport">Sport</button>
            </div>

            <div class="filter-section">
              <div class="filter-title">Preis</div>
              <button class="filter-btn" data-task="price-25">Unter 25 €</button>
              <button class="filter-btn" data-task="price-50">25–50 €</button>
              <button class="filter-btn" data-task="price-100">50–100 €</button>
            </div>

            <div class="filter-section">
              <div class="filter-title">Bewertung</div>
              <button class="filter-btn" data-task="rating-5">★★★★★</button>
              <button class="filter-btn" data-task="rating-4">★★★★☆+</button>
            </div>

            <button class="filter-btn reset" data-task="reset-filters">
              Filter zurücksetzen
            </button>
          </aside>

          <div class="products"></div>
        </div>
      </div>
    </div>

   

  </div>

  <!-- Skripte -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="script.js"></script>

  
  <div id="flyLayer" class="fly-layer"></div>

</body>
</html>
