<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schulazon – Freier Modus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="shell.css" />
</head>
<body data-mode="free">
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="appIcon" aria-hidden="true"></div>
        <div>
          <div class="logo">schul<span>azon</span></div>
          <div class="sub" id="subline">Freier Modus</div>
        </div>
      </div>
      <div class="status">
        <button class="pillBtn icon-btn" data-icon="expand" id="fsBtn" type="button">Vollbild</button>
        <button class="pillBtn icon-btn" data-icon="home" id="homeBtn" type="button">Startseite</button>
        <button class="pillBtn icon-btn" data-icon="help" id="helpBtn" type="button">Hilfe</button>

        <div class="topbar-progress" aria-label="Fortschritt">
          <div class="topbar-progress-meta">
            <div id="progressCount">0/0</div>
            <div id="progressPct">0%</div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <div id="scoreEl" class="score-corner topbar-score" aria-label="Score">Score 0</div>

        <details class="topbar-menu" id="labMenu">
          <summary class="pillBtn" aria-haspopup="menu">Tools</summary>
          <div class="menu-panel" role="menu">
            <button class="btn" id="btnSchema" type="button" role="menuitem">DB-Schema</button>
            <button class="btn" id="btnSpicker" type="button" role="menuitem">Theorie-Spicker</button>
            <button class="btn" id="btnSolutions" type="button" role="menuitem">Bereits geloeste Aufgaben</button>
            <button class="btn btn-locked" id="btnBonus" type="button" role="menuitem" aria-label="Zusatzaufgabe: Hacking">Zusatzaufgabe: Hacking</button>
          </div>
        </details>

        <div class="pill" id="pillName" style="display:none;">
          <span>Hi <b id="nameTag"></b> <span aria-hidden="true" class="hand">👋</span></span>
        </div>
      </div>
    </div>

    <div class="mode-shell">
      <iframe id="shopFrame" class="shop-frame" src="shop.html" title="Shop"></iframe>
      <main class="mode-right" id="modeRoot"></main>
    </div>
  </div>

  <!-- sql.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <!-- Mode Logic -->
  <script src="modes.js"></script>
</body>
</html>
